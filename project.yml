name: Aurelien
options:
  bundleIdPrefix: com.shereenmagdy
configs:
  Debug: debug
  Release: release
targets:
  Aurelien:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AurelienApp/Sources
        excludes:
          - public/**
      - path: AurelienApp/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BOUTIQUE
        PRODUCT_BUNDLE_IDENTIFIER: com.shereenmagdy.aurelien
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AurelienApp/Sources/Support/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APP_SHORTCUTS_ENABLE_FLEXIBLE_MATCHING: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: N5YRWQZ5W2
        PROVISIONING_PROFILE_SPECIFIER: ""
  AurelienTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AurelienApp/Tests
    dependencies:
      - target: Aurelien
    settings:
      base:
        PRODUCT_NAME: AurelienTests
        PRODUCT_BUNDLE_IDENTIFIER: com.shereenmagdy.aurelien.tests
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BOUTIQUE.app/BOUTIQUE"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: N5YRWQZ5W2
        PROVISIONING_PROFILE_SPECIFIER: ""
schemes:
  Aurelien:
    build:
      targets:
        Aurelien: all
        AurelienTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AurelienTests
    archive:
      config: Release
